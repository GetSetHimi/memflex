services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REFLEX_DB_PATH: /data/reflex.db
    volumes:
      - reflex-data:/data
    command: uvicorn reflex.api.app:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      REFLEX_API_URL: http://api:8000
    depends_on:
      - api
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  reflex-data:
